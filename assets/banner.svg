<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Vasamreddy Bharath Simha Reddy - Software Engineer - IIT Bhubaneswar">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05010D"/>
      <stop offset="55%" stop-color="#12042A"/>
      <stop offset="100%" stop-color="#2A0538"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B2FFF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ED1E79" stop-opacity=".95"/>
      <stop offset="65%" stop-color="#02D7F2" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#7B2FFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B2FFF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7B2FFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#sky)"/>

    <!-- perspective grid -->
    <g stroke="#7B2FFF" stroke-opacity=".28" stroke-width="1">
      <path d="M600 196 L-420 300M600 196 L-180 300M600 196 L60 300M600 196 L300 300M600 196 L520 300M600 196 L680 300M600 196 L900 300M600 196 L1140 300M600 196 L1380 300M600 196 L1620 300"/>
      <path d="M0 206h1200M0 220h1200M0 238h1200M0 262h1200M0 292h1200"/>
    </g>
    <rect x="0" y="150" width="1200" height="46" fill="url(#fade)" opacity=".5"/>
    <rect x="0" y="195" width="1200" height="2" fill="url(#horizon)" filter="url(#glow)"/>

    <!-- skyline -->
    <g fill="#05010D" stroke="#02D7F2" stroke-opacity=".45" stroke-width="1">
      <rect x="40" y="96" width="46" height="100"/><rect x="96" y="130" width="30" height="66"/>
      <rect x="136" y="66" width="38" height="130"/><rect x="184" y="118" width="52" height="78"/>
      <rect x="960" y="110" width="44" height="86"/><rect x="1014" y="72" width="34" height="124"/>
      <rect x="1058" y="132" width="48" height="64"/><rect x="1116" y="98" width="40" height="98"/>
    </g>
    <g fill="#FCEE0A" opacity=".75">
      <rect x="50" y="108" width="4" height="4"/><rect x="62" y="120" width="4" height="4"/>
      <rect x="146" y="80" width="4" height="4"/><rect x="158" y="102" width="4" height="4"/>
      <rect x="1024" y="86" width="4" height="4"/><rect x="1070" y="146" width="4" height="4"/>
      <rect x="1126" y="112" width="4" height="4"/><rect x="196" y="132" width="4" height="4"/>
    </g>

    <!-- HUD corner brackets -->
    <g stroke="#FCEE0A" stroke-width="2" fill="none" opacity=".85">
      <path d="M18 40V18h30M1182 40V18h-30M18 260v22h30M1182 260v22h-30"/>
    </g>

    <!-- name: chromatic aberration stack -->
    <g font-family="'Courier New',ui-monospace,monospace" font-weight="700" text-anchor="middle">
      <text x="600" y="112" font-size="54" letter-spacing="9" fill="#ED1E79" opacity=".85" transform="translate(-3,2)">BHARATH SIMHA</text>
      <text x="600" y="112" font-size="54" letter-spacing="9" fill="#02D7F2" opacity=".85" transform="translate(3,-2)">BHARATH SIMHA</text>
      <text x="600" y="112" font-size="54" letter-spacing="9" fill="#F4F9FF" filter="url(#glow)">BHARATH SIMHA</text>
      <text x="600" y="150" font-size="17" letter-spacing="7" fill="#FCEE0A">FULL-STACK  //  IIT BHUBANESWAR CSE</text>
    </g>

    <!-- glitch slices -->
    <g opacity=".9">
      <rect x="0" y="88" width="1200" height="7" fill="#02D7F2" opacity="0">
        <animate attributeName="opacity" values="0;0;.5;0;0" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="x" values="0;-26;18;0" dur="5.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="122" width="1200" height="5" fill="#ED1E79" opacity="0">
        <animate attributeName="opacity" values="0;0;0;.55;0" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="x" values="0;30;-14;0" dur="5.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- scanline sweep -->
    <rect x="0" y="0" width="1200" height="40" fill="#02D7F2" opacity=".07">
      <animate attributeName="y" values="-40;300" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- barcode + status rail -->
    <g fill="#F4F9FF" opacity=".65">
      <rect x="1000" y="40" width="2" height="18"/><rect x="1005" y="40" width="4" height="18"/>
      <rect x="1012" y="40" width="2" height="18"/><rect x="1017" y="40" width="5" height="18"/>
      <rect x="1025" y="40" width="2" height="18"/><rect x="1030" y="40" width="3" height="18"/>
      <rect x="1037" y="40" width="6" height="18"/><rect x="1046" y="40" width="2" height="18"/>
      <rect x="1051" y="40" width="4" height="18"/><rect x="1058" y="40" width="2" height="18"/>
    </g>
    <text x="1160" y="54" font-family="'Courier New',monospace" font-size="12" letter-spacing="2" fill="#02D7F2" text-anchor="end">ID//23CS01066</text>
    <g>
      <circle cx="52" cy="48" r="5" fill="#00FF9C">
        <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="68" y="53" font-family="'Courier New',monospace" font-size="12" letter-spacing="2" fill="#00FF9C">STATUS: SHIPPING</text>
    </g>

    <!-- hazard footer -->
    <rect x="0" y="288" width="1200" height="12" fill="#FCEE0A"/>
    <g fill="#05010D">
      <path d="M0 288h14l-14 12z"/><path d="M28 288h14l-14 12H14z"/><path d="M56 288h14l-14 12H42z"/>
      <path d="M84 288h14l-14 12H70z"/><path d="M112 288h14l-14 12H98z"/><path d="M140 288h14l-14 12h-14z"/>
      <path d="M1060 288h14l-14 12h-14z"/><path d="M1088 288h14l-14 12h-14z"/><path d="M1116 288h14l-14 12h-14z"/>
      <path d="M1144 288h14l-14 12h-14z"/><path d="M1172 288h14l-14 12h-14z"/><path d="M1200 288l-14 12h-14z"/>
    </g>
  </g>
</svg>
